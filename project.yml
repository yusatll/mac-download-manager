name: HizDownloadManager
options:
  bundleIdPrefix: com.macdm
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  HDMCore:
    path: Packages/HDMCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  HizDownloadManager:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: HDMCore
        product: HDMCore
      - package: HDMCore
        product: HDMIPC
      - target: HDMExtension
    postBuildScripts:
      - script: |
          cd "$SRCROOT/Packages/HDMCore"
          swift build -c debug --product macdm-bridge
          BIN_PATH=$(swift build -c debug --product macdm-bridge --show-bin-path)
          HELPERS="$BUILT_PRODUCTS_DIR/$FULL_PRODUCT_NAME/Contents/Helpers"
          mkdir -p "$HELPERS"
          cp "$BIN_PATH/macdm-bridge" "$HELPERS/macdm-bridge"
        name: Embed macdm-bridge helper
    info:
      path: App/Info.plist
      properties:
        HDMDevelopmentTeam: $(DEVELOPMENT_TEAM)
        CFBundleDisplayName: MacDM
        CFBundleName: MacDM
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, tr]
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "14.0"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macdm.MacDM
        PRODUCT_NAME: MacDM
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/HizDownloadManager.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic

  HDMExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: SafariExtension
    dependencies:
      - package: HDMCore
        product: HDMIPC
    info:
      path: SafariExtension/Info.plist
      properties:
        HDMDevelopmentTeam: $(DEVELOPMENT_TEAM)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macdm.MacDM.SafariExtension
        PRODUCT_NAME: MacDM Extension
        CODE_SIGN_ENTITLEMENTS: SafariExtension/SafariExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
